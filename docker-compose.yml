services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./boardy-laravel:/var/www/html:ro
    depends_on:
      - laravel
      - fastapi
    networks:
      - boardy_net

  laravel:
    build:
      context: ./boardy-laravel
      dockerfile: Dockerfile
    volumes:
      - laravel_storage:/var/www/html/storage
    networks:
      - boardy_net

  fastapi:
    build:
      context: ./opt/boardy-api
      dockerfile: Dockerfile
    environment:
      DB__HOST: mysql
      DB__PORT: 3306
      DB__USER: ${DB__USER}
      DB__PASSWORD: ${DB__PASSWORD}
      DB__NAME: boardy_api
      DB__CHARSET: utf8mb4
      DB__ECHO: "False"
      REDIS_HOST: redis
    networks:
      - boardy_net

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ${DB__USER}
      MYSQL_PASSWORD: ${DB__PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - boardy_net

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - boardy_net

volumes:
  mysql_data:
  redis_data:
  laravel_storage:

networks:
  boardy_net:
    driver: bridge
