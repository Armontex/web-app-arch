services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./boardy-laravel:/var/www/html:ro
    depends_on:
      - laravel
      - fastapi
    networks:
      - boardy_net

  laravel:
    build:
      context: ./boardy-laravel
      dockerfile: Dockerfile
    env_file:
      - ./boardy-laravel/.env
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - boardy_net

  fastapi:
    build:
      context: ./opt/boardy-api
      dockerfile: Dockerfile
    environment:
      DB__HOST: mysql
      DB__PORT: 3306
      DB__USER: ${DB_USER}
      DB__PASSWORD: ${DB_PASSWORD}
      DB__API_NAME: boardy_api
      DB__CHARSET: utf8mb4
      DB__ECHO: "False"
      FRONTEND_ORIGINS: http://localhost,http://127.0.0.1
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/status')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - boardy_net

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
    networks:
      - boardy_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks:
      - boardy_net

volumes:
  mysql_data:
  redis_data:
  laravel_storage:

networks:
  boardy_net:
    driver: bridge
