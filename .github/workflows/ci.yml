name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          find boardy-laravel \
            -path "boardy-laravel/vendor" -prune -o \
            -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Python syntax check
        run: |
          python3 -m compileall opt/boardy-api -q \
            -x '(\.venv|__pycache__)'
