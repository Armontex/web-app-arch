name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          find boardy-laravel \
            -path "boardy-laravel/vendor" -prune -o \
            -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Python syntax check
        run: |
          python3 -m compileall opt/boardy-api -q \
            -x '(\.venv|__pycache__)'

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env files
        run: |
          cp .env.example .env
          cp boardy-laravel/.env.example boardy-laravel/.env

      - name: Build images
        run: |
          for i in {1..3}; do
            docker compose build && exit 0
            sleep 10
          done
          docker compose build

      - name: Start stack
        run: docker compose up -d --wait

      - name: Smoke endpoints
        run: |
          for i in {1..30}; do
            docker compose exec -T nginx wget -qO- http://127.0.0.1/health && \
              docker compose exec -T nginx wget -qO- http://127.0.0.1/api/health && break
            sleep 2
          done
          docker compose exec -T nginx wget -S -O- http://127.0.0.1/health
          docker compose exec -T nginx wget -S -O- http://127.0.0.1/api/health

      - name: Dump compose diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=120 nginx laravel fastapi mysql redis

      - name: Tear down
        if: always()
        run: docker compose down -v

  test:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite

      - name: Install PHP dependencies
        working-directory: boardy-laravel
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        working-directory: boardy-laravel
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test --filter=HealthTest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: opt/boardy-api
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: opt/boardy-api
        run: python -m pytest tests/test_health.py -v
